[project]
name = "qqbot"
version = "0.0.0"
description = "基于 NoneBot2 与 NapCat OneBot V11 的 QQ 机器人"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.4.2,<3.0.0",
    "nonebot-adapter-onebot>=2.4.6,<3.0.0",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
]

[tool.nonebot]
adapter = ["nonebot.adapters.onebot.v11"]
plugin_dirs = ["src/plugins"]
